# Gitleaks config for CI and local scans: the default rules, minus three files of made-up test data.
[extend]
useDefault = true

[[allowlists]]
description = "Dummy SCRAM test vector, placeholder vault keys and the mock server's fake API key"
paths = [
  '''(^|/)app/src/test/kotlin/com/arceusvault/keel/core/network/ScramTest\.kt$''',
  '''(^|/)app/src/test/kotlin/com/arceusvault/keel/core/security/VaultTest\.kt$''',
  '''(^|/)tools/mock-truenas/mock_truenas\.py$''',
]

[[allowlists]]
description = "F-Droid's AllowedAPKSigningKeys is the public signing certificate's SHA-256, not a secret"
regexTarget = "match"
regexes = ['''AllowedAPKSigningKeys: 47ba2ba3ea64c6ef9b53267325c5ceb1ac95965faec91987bd6fe2d5ea603eda''']
